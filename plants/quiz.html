<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌟 Plant Quiz Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Comic Neue', cursive;
            background: linear-gradient(to bottom, #f0fff0, #d0f0c0);
            margin: 0;
            padding: 20px;
            text-align: center;
            color: #333;
        }
        h1 {
            font-size: 2.5em;
            color: #2e7d32;
            margin-bottom: 10px;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .quiz-container {
            background: #fff;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            max-width: 600px;
            margin: 20px auto;
        }
        .question {
            font-size: 1.4em;
            margin-bottom: 20px;
        }
        .option {
            background-color: #fff59d;
            padding: 12px;
            margin: 10px auto;
            width: 80%;
            border-radius: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
        }
        .option:hover {
            background-color: #fdd835;
            transform: scale(1.05);
        }
        #result {
            font-size: 1.2em;
            margin-top: 20px;
            color: #2e7d32;
        }
        .character {
            width: 100px;
            margin: 20px auto;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        .next-button {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #81c784;
            color: white;
            font-size: 1em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .next-button:hover {
            background-color: #66bb6a;
        }
        #popper {
            display: none;
            position: fixed;
            left: 50%;
            top: 20%;
            transform: translate(-50%, 0);
            z-index: 1000;
            width: 400px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <h1>🌿 Plant Quiz Game</h1>

    <img id="popper" src="img/popper.gif" alt="Popper Celebration">

    <div class="quiz-container">
        <div class="question" id="question">Loading question...</div>
        <div class="option" onclick="selectAnswer(this)"></div>
        <div class="option" onclick="selectAnswer(this)"></div>
        <div class="option" onclick="selectAnswer(this)"></div>
        <div class="option" onclick="selectAnswer(this)"></div>
        <div id="result"></div>
        <button class="next-button" onclick="nextQuestion()">Next Question ➡️</button>
    </div>

    <script>
        const questions = [
            {
                q: "Which part of the plant absorbs water?",
                options: ["Leaf", "Root", "Stem", "Flower"],
                answer: "Root"
            },
            {
                q: "Which part of the plant makes food?",
                options: ["Leaf", "Root", "Stem", "Seed"],
                answer: "Leaf"
            },
            {
                q: "What grows into a new plant?",
                options: ["Leaf", "Stem", "Seed", "Flower"],
                answer: "Seed"
            },
            {
                q: "Which part holds the plant in soil?",
                options: ["Flower", "Root", "Fruit", "Leaf"],
                answer: "Root"
            }
        ];

        let current = 0;

        function loadQuestion() {
            const q = questions[current];
            document.getElementById("question").innerText = q.q;
            const opts = document.querySelectorAll(".option");
            q.options.forEach((opt, i) => {
                opts[i].innerText = opt;
                opts[i].style.backgroundColor = '#fff59d';
                opts[i].style.pointerEvents = 'auto';
            });
            document.getElementById("result").innerText = '';
        }

        function showPopper() {
            const popper = document.getElementById('popper');
            popper.style.display = 'block';
            setTimeout(() => {
                popper.style.display = 'none';
            }, 2000);
        }

        function selectAnswer(element) {
            const selected = element.innerText;
            const correct = questions[current].answer;
            const opts = document.querySelectorAll(".option");
            opts.forEach(opt => opt.style.pointerEvents = 'none');
            if (selected === correct) {
                element.style.backgroundColor = '#a5d6a7';
                document.getElementById("result").innerText = "✅ Correct!";
                showPopper();
            } else {
                element.style.backgroundColor = '#ef9a9a';
                document.getElementById("result").innerText = `❌ Oops! Correct answer is: ${correct}`;
            }
        }

        function nextQuestion() {
            current++;
            if (current >= questions.length) {
                document.querySelector(".quiz-container").innerHTML = "<h2>🎉 Great job! You finished the quiz!</h2>";
            } else {
                loadQuestion();
            }
        }

        window.onload = loadQuestion;
    </script>
</body>
</html>
